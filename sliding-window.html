<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>滑动窗口剪枝可视化 - 动态演示</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
        font-size: 2.5em;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 1.1em;
      }

      .info-panel {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .info-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
      }

      .info-card h3 {
        font-size: 14px;
        opacity: 0.9;
        margin-bottom: 10px;
      }

      .info-card .value {
        font-size: 28px;
        font-weight: bold;
      }

      .info-card .label {
        font-size: 12px;
        opacity: 0.8;
        margin-top: 5px;
      }

      .matrix-container {
        overflow-x: auto;
        margin: 30px 0;
        background: #f8f9fa;
        padding: 20px;
        border-radius: 12px;
      }

      .matrix {
        border-collapse: collapse;
        margin: 0 auto;
        font-size: 14px;
      }

      .matrix th,
      .matrix td {
        padding: 8px 12px;
        text-align: center;
        border: 1px solid #ddd;
        min-width: 50px;
        position: relative;
      }

      .matrix th {
        background: #667eea;
        color: white;
        font-weight: bold;
      }

      .matrix td {
        background: white;
        transition: all 0.3s;
      }

      .matrix td.checked {
        background: #51cf66;
        color: white;
        font-weight: bold;
      }

      .matrix td.pruned {
        background: #ff6b6b;
        color: white;
        text-decoration: line-through;
        opacity: 0.7;
      }

      .matrix td.current {
        background: #ffd43b;
        color: #333;
        font-weight: bold;
        box-shadow: 0 0 10px rgba(255, 212, 59, 0.8);
        transform: scale(1.1);
        z-index: 10;
      }

      .matrix td.invalid {
        background: #e9ecef;
        color: #adb5bd;
      }

      .controls {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin: 30px 0;
      }

      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: bold;
      }

      .btn-primary {
        background: #667eea;
        color: white;
      }

      .btn-primary:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-secondary {
        background: #6c757d;
        color: white;
      }

      .btn-secondary:hover {
        background: #5a6268;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .explanation {
        background: #e7f3ff;
        border-left: 4px solid #667eea;
        padding: 20px;
        border-radius: 8px;
        margin-top: 20px;
      }

      .explanation h3 {
        color: #667eea;
        margin-bottom: 10px;
      }

      .explanation p {
        color: #333;
        line-height: 1.6;
        margin-bottom: 10px;
      }

      .pointer-info {
        display: flex;
        gap: 30px;
        justify-content: center;
        margin-bottom: 20px;
        font-size: 18px;
        flex-wrap: wrap;
      }

      .pointer-info span {
        padding: 10px 20px;
        background: #f0f0f0;
        border-radius: 8px;
        font-weight: bold;
      }

      .pointer-info .left {
        color: #51cf66;
      }

      .pointer-info .right {
        color: #ff6b6b;
      }

      .step-counter {
        text-align: center;
        font-size: 18px;
        color: #666;
        margin-bottom: 20px;
      }

      .window-display {
        text-align: center;
        margin: 20px 0;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 8px;
        font-size: 18px;
      }

      .window-display .window {
        font-family: 'Courier New', monospace;
        background: white;
        padding: 10px 20px;
        border-radius: 6px;
        display: inline-block;
        margin: 0 10px;
        border: 2px solid #667eea;
      }

      .window-display .has-duplicate {
        border-color: #ff6b6b;
        background: #ffe0e0;
      }

      .window-display .no-duplicate {
        border-color: #51cf66;
        background: #e0ffe0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🪟 滑动窗口剪枝可视化</h1>
      <p class="subtitle">动态演示：从 O(n²) 优化到 O(n) 的剪枝过程 - 无重复字符的最长子串</p>

      <div class="info-panel">
        <div class="info-card">
          <h3>初始组合数</h3>
          <div class="value" id="totalCombinations">0</div>
          <div class="label">O(n²)</div>
        </div>
        <div class="info-card">
          <h3>剩余组合数</h3>
          <div class="value" id="remainingCombinations">0</div>
          <div class="label" id="remainingLabel">待检查</div>
        </div>
        <div class="info-card">
          <h3>已检查组合</h3>
          <div class="value" id="checkedCombinations">0</div>
          <div class="label">当前进度</div>
        </div>
        <div class="info-card">
          <h3>已剪枝组合</h3>
          <div class="value" id="prunedCombinations">0</div>
          <div class="label">被剪掉</div>
        </div>
        <div class="info-card">
          <h3>时间复杂度</h3>
          <div class="value" id="timeComplexity">O(n²)</div>
          <div class="label" id="timeLabel">优化中...</div>
        </div>
      </div>

      <div class="step-counter">
        <span>步骤：<strong id="stepCount">0</strong></span>
      </div>

      <div class="pointer-info">
        <span class="left">左指针 (left): <strong id="leftPointer">0</strong></span>
        <span class="right">右指针 (right): <strong id="rightPointer">0</strong></span>
      </div>

      <div class="window-display">
        <span>当前窗口：</span>
        <span class="window" id="windowDisplay">-</span>
        <span id="windowStatus"></span>
      </div>

      <div class="matrix-container">
        <table class="matrix" id="matrix"></table>
      </div>

      <div class="controls">
        <button class="btn btn-primary" onclick="nextStep()">下一步 ▶</button>
        <button class="btn btn-secondary" onclick="reset()">重置 🔄</button>
        <button class="btn btn-secondary" onclick="autoPlay()">自动播放 ⏯</button>
      </div>

      <div class="explanation" id="explanation">
        <h3>💡 说明</h3>
        <p id="explanationText">点击"下一步"开始演示滑动窗口的剪枝过程</p>
      </div>
    </div>

    <script>
      let state = {
        left: 0,
        right: 0,
        step: 0,
        checked: new Set(), // 已检查的组合
        pruned: new Set(), // 被剪掉的组合
        data: 'abcabcbb', // 字符串数据
        autoPlayInterval: null,
      };

      // 初始化矩阵
      function initMatrix() {
        const matrix = document.getElementById('matrix');
        matrix.innerHTML = '';
        const n = state.data.length;

        // 创建表头
        const headerRow = document.createElement('tr');
        const emptyCell = document.createElement('th');
        headerRow.appendChild(emptyCell);
        for (let j = 0; j < n; j++) {
          const th = document.createElement('th');
          th.textContent = j;
          headerRow.appendChild(th);
        }
        matrix.appendChild(headerRow);

        // 创建数据行
        for (let i = 0; i < n; i++) {
          const row = document.createElement('tr');
          const rowHeader = document.createElement('th');
          rowHeader.textContent = i;
          row.appendChild(rowHeader);

          for (let j = 0; j < n; j++) {
            const cell = document.createElement('td');
            if (i > j) {
              cell.textContent = '-';
              cell.classList.add('invalid');
            } else {
              const key = `${i},${j}`;
              cell.textContent = key;
              cell.id = `cell-${i}-${j}`;
            }
            row.appendChild(cell);
          }
          matrix.appendChild(row);
        }

        updateStats();
      }

      // 检查窗口是否有重复字符
      function hasDuplicate(left, right) {
        const window = state.data.slice(left, right + 1);
        const chars = new Set();
        for (let char of window) {
          if (chars.has(char)) {
            return true;
          }
          chars.add(char);
        }
        return false;
      }

      // 获取窗口字符串
      function getWindowString(left, right) {
        return state.data.slice(left, right + 1);
      }

      // 更新统计信息
      function updateStats() {
        const n = state.data.length;
        const total = (n * (n + 1)) / 2;
        const checked = state.checked.size;
        const pruned = state.pruned.size;
        const remaining = total - checked - pruned;

        document.getElementById('totalCombinations').textContent = total;
        document.getElementById('checkedCombinations').textContent = checked;
        document.getElementById('prunedCombinations').textContent = pruned;
        document.getElementById('remainingCombinations').textContent = remaining;

        // 更新时间复杂度显示
        const timeComplexity = document.getElementById('timeComplexity');
        const timeLabel = document.getElementById('timeLabel');
        if (remaining <= n) {
          timeComplexity.textContent = 'O(n)';
          timeLabel.textContent = '优化完成！';
          timeComplexity.style.color = '#51cf66';
        } else {
          timeComplexity.textContent = 'O(n²)';
          timeLabel.textContent = '优化中...';
          timeComplexity.style.color = '#ff6b6b';
        }
      }

      // 更新矩阵显示
      function updateMatrix() {
        const n = state.data.length;

        // 清除所有高亮
        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n; j++) {
            if (i <= j) {
              const cell = document.getElementById(`cell-${i}-${j}`);
              if (cell) {
                cell.classList.remove('checked', 'pruned', 'current');
              }
            }
          }
        }

        // 标记已检查的组合
        state.checked.forEach((key) => {
          const [i, j] = key.split(',').map(Number);
          const cell = document.getElementById(`cell-${i}-${j}`);
          if (cell) {
            cell.classList.add('checked');
          }
        });

        // 标记被剪掉的组合
        state.pruned.forEach((key) => {
          const [i, j] = key.split(',').map(Number);
          const cell = document.getElementById(`cell-${i}-${j}`);
          if (cell) {
            cell.classList.add('pruned');
          }
        });

        // 高亮当前检查的组合
        if (state.left <= state.right) {
          const cell = document.getElementById(`cell-${state.left}-${state.right}`);
          if (cell) {
            cell.classList.add('current');
          }
        }
      }

      // 更新窗口显示
      function updateWindowDisplay() {
        const windowDisplay = document.getElementById('windowDisplay');
        const windowStatus = document.getElementById('windowStatus');
        const window = getWindowString(state.left, state.right);
        const duplicate = hasDuplicate(state.left, state.right);

        windowDisplay.textContent = window || '-';
        windowDisplay.className = 'window';
        if (window) {
          windowDisplay.classList.add(duplicate ? 'has-duplicate' : 'no-duplicate');
        }

        if (duplicate) {
          windowStatus.textContent = '❌ 存在重复字符';
          windowStatus.style.color = '#ff6b6b';
        } else {
          windowStatus.textContent = '✅ 无重复字符';
          windowStatus.style.color = '#51cf66';
        }
      }

      // 更新说明文字
      function updateExplanation() {
        const explanationText = document.getElementById('explanationText');
        const window = getWindowString(state.left, state.right);
        const duplicate = hasDuplicate(state.left, state.right);

        if (state.step === 0) {
          explanationText.textContent = '点击"下一步"开始演示滑动窗口的剪枝过程';
          return;
        }

        let text = `步骤 ${state.step}：当前检查窗口 [${state.left}, ${state.right}] = "${window}"\n\n`;

        if (duplicate) {
          text += `❌ 窗口存在重复字符，需要移动 left 指针缩小窗口。\n\n`;
          text += `📊 剪枝效果：移动 left++ 后，将剪掉第 ${state.left} 行的所有剩余组合 `;
          text += `(${state.left}, ${state.right + 1}) 到 (${state.left}, ${state.data.length - 1})。\n\n`;
          text += `💡 原理：如果窗口 [${state.left}, ${state.right}] 存在重复字符，`;
          text += `那么所有包含该窗口的更大窗口 [${state.left}, ${state.right + 1}]、[${state.left}, ${state.right + 2}]... 必然也包含重复字符，无需检查。`;
        } else {
          text += `✅ 窗口无重复字符，可以继续扩展 right 指针探索更长的有效窗口。\n\n`;
          text += `📊 当前窗口是有效的，记录长度 ${state.right - state.left + 1}。\n\n`;
          text += `💡 原理：如果窗口 [${state.left}, ${state.right}] 无重复字符，`;
          text += `那么所有被该窗口包含的更小窗口 [${state.left + 1}, ${state.right}]、[${state.left + 2}, ${state.right}]... 必然也无重复字符，但长度更短，不是最优解。`;
        }

        explanationText.textContent = text;
      }

      // 执行下一步
      function nextStep() {
        const n = state.data.length;

        // 如果 right 已经到达末尾，结束
        if (state.right >= n) {
          document.getElementById('explanationText').textContent = '✅ 演示完成！所有有效组合已检查完毕。';
          return;
        }

        state.step++;

        // 检查当前窗口
        const duplicate = hasDuplicate(state.left, state.right);
        const key = `${state.left},${state.right}`;
        state.checked.add(key);

        if (duplicate) {
          // 存在重复字符，移动 left 指针，剪掉第 left 行的所有剩余组合
          for (let j = state.right + 1; j < n; j++) {
            const pruneKey = `${state.left},${j}`;
            if (!state.checked.has(pruneKey)) {
              state.pruned.add(pruneKey);
            }
          }
          state.left++;
        } else {
          // 无重复字符，继续扩展 right 指针
          state.right++;
        }

        // 更新显示
        document.getElementById('leftPointer').textContent = state.left;
        document.getElementById('rightPointer').textContent = state.right;
        document.getElementById('stepCount').textContent = state.step;

        updateMatrix();
        updateWindowDisplay();
        updateStats();
        updateExplanation();
      }

      // 重置
      function reset() {
        state = {
          left: 0,
          right: 0,
          step: 0,
          checked: new Set(),
          pruned: new Set(),
          data: 'abcabcbb',
          autoPlayInterval: null,
        };

        document.getElementById('leftPointer').textContent = '0';
        document.getElementById('rightPointer').textContent = '0';
        document.getElementById('stepCount').textContent = '0';

        initMatrix();
        updateWindowDisplay();
        updateExplanation();
      }

      // 自动播放
      function autoPlay() {
        if (state.autoPlayInterval) {
          clearInterval(state.autoPlayInterval);
          state.autoPlayInterval = null;
          document.querySelector('.btn-secondary:last-child').textContent = '自动播放 ⏯';
          return;
        }

        document.querySelector('.btn-secondary:last-child').textContent = '暂停 ⏸';
        state.autoPlayInterval = setInterval(() => {
          const n = state.data.length;
          if (state.right >= n) {
            clearInterval(state.autoPlayInterval);
            state.autoPlayInterval = null;
            document.querySelector('.btn-secondary:last-child').textContent = '自动播放 ⏯';
            return;
          }
          nextStep();
        }, 1000);
      }

      // 初始化
      initMatrix();
      updateWindowDisplay();
      updateExplanation();
    </script>
  </body>
</html>
